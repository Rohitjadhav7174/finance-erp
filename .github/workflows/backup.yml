# Nightly encrypted, off-site backup (02:00 IST). Secrets live in GitHub → Settings → Secrets.
# The job fails loudly (and the app shows a warning) if anything goes wrong.
name: nightly-backup
on:
  schedule:
    - cron: "30 20 * * *"   # 20:30 UTC = 02:00 IST
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PostgreSQL 17 client (must match Supabase's server version)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - run: pip install -q -r backend/requirements-ops.txt
      - name: Backup
        working-directory: backend
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          AGE_RECIPIENTS: ${{ secrets.AGE_RECIPIENTS }}
          BACKUP_STORAGE_URL: ${{ secrets.BACKUP_STORAGE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: auto
        run: python -m ops.backup
