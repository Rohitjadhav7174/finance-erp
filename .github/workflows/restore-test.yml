# Weekly proof that backups can be restored: restores the newest backup into a throwaway
# PostgreSQL 17 database, compares every row count and money total, and marks it VERIFIED.
# Uses the separate restore-test key (AGE_RESTORE_TEST_IDENTITY); the owner's key stays offline.
name: weekly-restore-test
on:
  schedule:
    - cron: "30 22 * * 0"   # Sunday 04:00 IST
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  restore-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      scratch:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: scratch-only
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - run: pip install -q -r backend/requirements-ops.txt
      - name: Restore newest backup and verify
        working-directory: backend
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_STORAGE_URL: ${{ secrets.BACKUP_STORAGE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: auto
          AGE_IDENTITY: ${{ secrets.AGE_RESTORE_TEST_IDENTITY }}
        run: |
          umask 077
          printf '%s\n' "$AGE_IDENTITY" > "$RUNNER_TEMP/restore-test.key"
          python -m ops.restore latest --target-url "postgresql://postgres:scratch-only@localhost:5432/postgres" \
            --identity-file "$RUNNER_TEMP/restore-test.key" --mark-verified
          rm -f "$RUNNER_TEMP/restore-test.key"
